baseURL: https://example.org/
locale: en-us
title: Anand Rajasekar
mainsections: ["posts"]
pagination:
  disableAliases: false
  pagerSize: 50

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: About
          url: about
          weight: 1
        - name: Bookshelf
          url: bookshelf
          weight: 2
        - name: Archive
          url: archives
          weight: 3
        - name: Tags
          url: tags/
          weight: 4
        - name: Search
          url: search/
          weight: 5
outputs:
  home:
    - HTML
    - RSS
    - JSON
params:
  ShowAllPagesInArchive: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
module:
  imports:
  - path: github.com/adityatelange/hugo-PaperMod
  - path: github.com/tgagor/hugo-PaperMod-bookshelf